# vim: set ts=4 sw=4 tw=120 fdm=indent et :
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf

source = palette_generated.conf

$font = SF Pro Display, Bold
$date_font = SF Pro Display, Medium
$korean_font = NanumGothic
$monofont = Fira Code Nerd Font, Bold
$monolight = Fira Code Nerd Font, Light
$status_bar_color = rgba(20, 24, 32, 0.55)
$status_text_color = rgba(216, 222, 233, 0.52)

general {
    fail_timeout = 1000
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = swift, 0.55, 0, 0.1, 1
    bezier = linear,   1, 1,   0, 0
    animation = fadeIn, 1, 10, swift
    animation = fadeOut, 0, 8, swift
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.7
    noise = 0.012
}

input-field {
    monitor =

    # Layout
    size = 20%, 5%
    position = 0, -20
    halign = center
    valign = center

    # Looks: Outline
    outline_thickness = 2
    outer_color = $theme_accent $theme_accent_bright 45deg
    check_color = $theme_success $theme_accent_bright 120deg
    fail_color = $theme_error $theme_error_alt 40deg
    bothlock_color = $theme_error $theme_error_alt 40deg
    rounding = -1
    shadow_passes = 3
    shadow_size = 12
    shadow_color = $theme_accent_bright

    # Looks: Inner
    inner_color = $theme_surface_secondary
    font_color = $theme_text
    fade_on_empty = true

    font_family = $monofont
    placeholder_text =
    fail_text = $PAMFAIL

    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3
}

# Lock indicator
label {
    monitor =
    text = <span> 󰌾 </span>
    color = $theme_accent_bright
    font_size = 72
    font_family = $monofont
    position = 0, 400
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $theme_text_clock
    font_size = 140
    font_family = $font
    position = 0, 240
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:30000] date +"%A, %d %B" # update every 30 seconds
    font_size = 40
    font_family = $date_font
    position = 0, 105
    halign = center
    valign = center
}

# Album art
image {
    monitor =
    path = ~/.config/hypr/assets/default-album-art.png
    size = 180
    rounding = 16
    reload_time = 1
    reload_cmd = ~/.config/hypr/scripts/songart.sh
    position = 0, 500
    halign = center
    valign = bottom
}

# Current song
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetails.sh)"
    color = $theme_text_media
    font_size = 30
    font_family = $korean_font
    position = 0, 320
    halign = center
    valign = bottom
}

# Status bar
shape {
    monitor =
    size = 100%, 120
    color = $status_bar_color
    position = 0, 0
    halign = center
    valign = bottom
}

# CPU usage
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh cpu
    color = $status_text_color
    font_size = 20
    font_family = $monolight
    position = -480, 55
    halign = center
    valign = bottom
}

# GPU usage
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh gpu
    color = $status_text_color
    font_size = 20
    font_family = $monolight
    position = -240, 55
    halign = center
    valign = bottom
}

# Network status
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh network
    color = $status_text_color
    font_size = 20
    font_family = $monolight
    position = 0, 55
    halign = center
    valign = bottom
}

# Memory usage
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh memory
    color = $status_text_color
    font_size = 20
    font_family = $monolight
    position = 240, 55
    halign = center
    valign = bottom
}

# System uptime
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh uptime
    color = $status_text_color
    font_size = 20
    font_family = $monolight
    position = 480, 55
    halign = center
    valign = bottom
}
