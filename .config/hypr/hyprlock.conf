# vim: set ts=4 sw=4 tw=120 fdm=indent et :
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf

$font = SF Pro Display, Bold
$date_font = SF Pro Display, Medium
$korean_font = NanumGothic
$monofont = Fira Code Nerd Font, Bold

general {
    fail_timeout = 1000
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = swift, 0.55, 0, 0.1, 1
    bezier = linear,   1, 1,   0, 0
    animation = fadeIn, 1, 10, swift
    animation = fadeOut, 0, 8, swift
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.7
    noise = 0.012
}

input-field {
    monitor =

    # Layout
    size = 20%, 5%
    position = 0, -20
    halign = center
    valign = center

    # Looks: Outline
    outline_thickness = 2
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    bothlock_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    rounding = -1

    # Looks: Inner
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true

    font_family = $monofont
    placeholder_text =
    fail_text = $PAMFAIL

    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = $font
    position = 0, 240
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:30000] date +"%A, %d %B" # update every 30 seconds
    font_size = 40
    font_family = $date_font
    position = 0, 105
    halign = center
    valign = center
}

# Current song
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetails.sh)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 25
    font_family = $korean_font
    position = 0, 60
    halign = center
    valign = bottom
}
